<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>온라인 팔레스타인 연대 행진</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="flagbar" aria-hidden="true"><i style="background:#141312"></i><i style="background:#F3EEE4;border-top:1px solid #ccc;border-bottom:1px solid #ccc"></i><i style="background:#0E7A3E"></i><i style="background:#C8102E"></i></div>

<div class="wrap langbar"><button class="langbtn" id="lang" aria-label="Language">EN</button></div>

<!-- 1. landing -->
<section class="screen on" id="s-home">
  <div class="wrap">
    <div class="hero">
      <h1 class="display" data-h="heroTitle"></h1>
      <p data-t="heroText"></p>
      <p class="sub-en" data-t="heroTextAlt"></p>
      <p class="credit" data-t="credit"></p>
    </div>
  </div>
  <div class="march" ><div class="lane" id="lane"></div></div>
  <div class="wrap">
    <p class="count" id="count" aria-live="polite">행렬을 불러오는 중…</p>
    <button class="btn wide" id="go" data-t="go"></button>
    <p class="foot" data-t="foot"></p>
  </div>
  <div class="band" aria-hidden="true"></div>
</section>

<!-- 2. nickname -->
<section class="screen" id="s-name">
  <div class="wrap">
    <div class="top"><button class="back" data-go="s-home" data-t="back"></button><span class="step">1 / 3</span></div>
    <h2 class="display" data-h="nameTitle"></h2>
    <label class="sr" for="nick">닉네임</label>
    <input type="text" id="nick" maxlength="12"  autocomplete="off">
    <p class="hint" data-t="nickHint"></p>
    <button class="btn wide" id="toMood" disabled data-t="next"></button>
  </div>
</section>

<!-- 3. mood -->
<section class="screen" id="s-mood">
  <div class="wrap">
    <div class="top"><button class="back" data-go="s-name" data-t="back"></button><span class="step">2 / 3</span></div>
    <h2 class="display" id="moodQ"></h2>
    <div class="moods" id="moods" role="group" aria-labelledby="moodQ"></div>
    <button class="btn wide" id="toBuild" data-t="next"></button>
  </div>
</section>

<!-- 4. builder -->
<section class="screen" id="s-build">
  <div class="wrap">
    <div class="top"><button class="back" data-go="s-mood" data-t="back"></button><span class="step">3 / 3</span></div>
    <div class="stage" id="stage" role="img" ></div>
    <div class="tools"><button class="tool" id="reset" data-t="reset"></button><button class="tool" id="rand" data-t="rand"></button></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="panel" id="panel" role="tabpanel"></div>
    <div class="done-bar"><button class="btn wide" id="finish" data-t="finish"></button></div>
  </div>
</section>

<!-- 5. certificate -->
<section class="screen" id="s-cert">
  <div class="wrap">
    <div class="top"><button class="back" data-go="s-build" data-t="backEdit"></button><span class="step" data-t="certTitle"></span></div>
    <div class="cert" id="cert">
      <div class="head"><div class="display" data-t="certTitle"></div></div>
      <div class="av" id="certAv"></div>
      <div class="body">
        <p id="certLine"></p>
        <p class="no" id="certNo"></p>
        <p class="tags" data-t="tags"></p>
      </div>
    </div>
    <p class="notice" id="joinMsg" aria-live="polite"></p>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="save" data-t="save"></button>
      <button class="btn ghost" id="seeMarch" data-t="seeMarch"></button>
    </div>
    <div class="preview" id="preview"><img id="previewImg" alt=""><p class="notice" style="padding:0 12px" data-t="previewNote"></p></div>
    <div class="alt">
      <label for="altText"><strong data-t="altLabel"></strong> <span class="step" data-t="altSub"></span></label>
      <textarea id="altText" readonly></textarea>
      <button class="tool" id="copyAlt" data-t="copy"></button>
    </div>
  </div>
  <div class="band" aria-hidden="true"></div>
</section>

<script src="script.js"></script>
</body>
</html>
